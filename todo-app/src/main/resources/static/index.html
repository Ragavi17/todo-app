<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="board">
    <header class="board__header">
        <h1>Today's list</h1>
        <p class="board__count"><span id="remaining-count">0</span> left</p>
    </header>

    <form id="add-form" class="add-form">
        <input type="text" id="title-input" class="add-form__input" placeholder="Add a task…" aria-label="New task" required minlength="3" maxlength="100">
        <input type="text" id="category-input" class="add-form__input add-form__input--small" placeholder="Category" aria-label="Category" required>
        <input type="date" id="due-date-input" class="add-form__input add-form__input--small" aria-label="Due date" required>
        <select id="priority-input" class="add-form__select" aria-label="Priority">
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
        </select>
        <button type="submit" class="add-form__button">Add</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>Nothing here yet. Add your first task above.</p>
</main>

<script src="js/app.js"></script>
</body>
</html>
